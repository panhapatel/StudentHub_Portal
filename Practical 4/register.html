<!DOCTYPE html>
<html>
<head>
   <link rel="stylesheet" href="style.css">
<title>Register</title>
</head>
<body>
   <table width="100%">
      <tr>
         <td width="20%" align="center">
            <img src="logo.png" width="100">
         </td>
         <td width="60%">
            <h1>STUDENTHUB PORTAL</h1>
         </td>
         <td width="20%">

         </td>
      </tr>
   </table>
<center>
   
<h2>
   <span style="color:maroon;
           background-color:khaki;
           font-weight:bold;">
         Student Registration  
         </span>
         </h2>
         </center>
           

   <div class="login-box">  
<form  action="login.html" method="post"> 
    
       <label for="name">Name</label>
       <input type="text" id="name" name="name" placeholder="Enter your name" required ><br><br>
 
    

    
       <label for="email">Email</label>
       <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
 
    
      Gender:<input type="radio" value="Male" id="male" name="gender" required>
                Male
       
       <input type="radio" value="Female" id="female" name="gender"/>
                Female<br></br>
                <label for="Username">Username</label>
      <input type="text" id="Username" name="Username" placeholder="Enter your username" required><br><br>


    
         <label for="Password">Password</label>
       <input type="password" id="Password" name="Password" placeholder="Enter your Password" required><br><br>
 
    
    
         <label for="ConfirmPassword">Confirm Password</label>
       <input type="password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Confirm password" required><br><br>
 
    

   


   <input type="submit" value="Register">

</form>
<p>If you have already registered 
   <a href="login.html">Please login</a>
</p>
</div>

</body>
</html>
