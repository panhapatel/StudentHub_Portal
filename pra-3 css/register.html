<!DOCTYPE html>
<html>
<head>
   <link rel="stylesheet" href="style.css">
<title>Register</title>
</head>
<body>
   <table width="100%">
      <tr>
         <td width="20%" align="center">
            <img src="logo.png" width="100">
         </td>
         <td width="60%">
            <h1>STUDENTHUB PORTAL</h1>
         </td>
         <td width="20%">

         </td>
      </tr>
   </table>
<center>
   
<h2>
   <span style="color:maroon;
           background-color:khaki;
           font-weight:bold;">
         Student Registration  
         </span>
         </h2>
         </center>
           

   <div class="login-box">  
<form  action="login.html" method="post"> 
    
      <label for="name">Name</label>
      <input type="text" id="name" name="name"placeholder="Enter your name" pattern="^[A-Za-z ]{2,50}&" required>
      <br><br>


      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      <br><br>


<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" name="mobile"placeholder="Enter your mobile number" pattern="^[6-9][0-9]{9}&" required>
<br><br>


<label for="Password">Password</label>
<input type="password" id="Password" name="Password" placeholder="Enter your Password"
       pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
       required>
<br><br>


<label for="ConfirmPassword">Confirm Password</label>
<input type="password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Confirm password" required>
<br><br>


<label for="course">Course</label>
<select id="course" name="course" required>
    <option value="">-- Select Course --</option>
    <option value="BCA">BCA</option>
    <option value="B.Tech">B.Tech</option>
    <option value="MCA">MCA</option>
    <option value="M.Tech">M.Tech</option>
</select>
<br><br>


<label for="year">Year</label>
<select id="year" name="year" required>
    <option value="">-- Select Year --</option>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
</select>
<br><br>


Gender:
<input type="radio" value="Male" id="male" name="gender" required>
<label for="male">Male</label>

<input type="radio" value="Female" id="female" name="gender">
<label for="female">Female</label>
<br><br>


<input type="checkbox" id="terms" name="terms" required>
<label for="terms">I accept the Terms and Conditions</label>
<br><br>


<button type="submit">Register</button>

</form>
<p>If you have already registered 
   <a href="login.html">Please login</a>
</p>
</div>

<footer>
   &copy;2026 StudentHub Portal
</footer>

</body>
</html>
